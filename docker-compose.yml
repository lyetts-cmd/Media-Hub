services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: cadence_music
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_music"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Option A: pull the pre-built image from GitHub Container Registry (fastest).
    # image: ghcr.io/lyetts-cmd/media-hub:latest

    # Option B: build from source (comment out Option A, uncomment below).
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # All app config comes from .env -- no interpolation needed here.
    env_file:
      - .env
    ports:
      # Change 4000 to your preferred port on both sides if needed.
      - "4000:4000"
    volumes:
      # EDIT THIS LINE: replace /your/music/directory with your actual music path.
      - /your/music/directory:/music
    # VAAPI hardware acceleration (Intel/AMD x86 with integrated graphics).
    # Uncomment below and set FFMPEG_HWACCEL=vaapi in your .env file.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128

volumes:
  db_data:
