services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cadence_music
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence_music"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # Option A: pull the pre-built image from GitHub Container Registry (fastest).
    # Replace "latest" with a specific version tag (e.g. "1.2.0") to pin a release.
    # image: ${CADENCE_IMAGE}

    # Option B: build the image from source (comment out Option A, uncomment below).
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      MUSIC_DIR: ${MUSIC_DIR}
      TRANSCODE_WORKERS: ${TRANSCODE_WORKERS}
      FFMPEG_THREADS: ${FFMPEG_THREADS}
      FFMPEG_HWACCEL: ${FFMPEG_HWACCEL}
      VAAPI_DEVICE: ${VAAPI_DEVICE}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ${MUSIC_DIR}:/music
    # VAAPI hardware acceleration (Intel/AMD integrated graphics on Linux x86).
    # Uncomment the devices block below and set FFMPEG_HWACCEL=vaapi in your
    # .env file to enable GPU-accelerated transcoding.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128

volumes:
  db_data:
